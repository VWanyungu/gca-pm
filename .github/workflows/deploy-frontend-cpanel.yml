name: Deploy Frontend to cPanel

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy standalone build and restart app
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
          WORKING_DIR: ${{ secrets.CPANEL_FRONTEND_WORKING_DIR }}
        run: |
          set -euo pipefail
          touch /tmp/restart.txt

          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" <<-EOF
          set net:timeout 15
          set net:max-retries 2
          set mirror:parallel-transfer-count 10
          cd "$WORKING_DIR"

          # 2 & 3. Replace the standalone folder: upload changed files, delete
          # anything no longer present locally (one pass instead of a full
          # serial delete followed by a full re-upload, which times out on
          # the ~2000 files Next's standalone output includes).
          mirror --reverse --delete --verbose frontend/.next/standalone standalone

          # 4. Copy .htaccess from working folder to the standalone folder
          get .htaccess -o /tmp/.htaccess
          put /tmp/.htaccess -o standalone/.htaccess

          # Restart the Node app (Passenger picks this up on the next request)
          mkdir -p standalone/tmp
          put /tmp/restart.txt -o standalone/tmp/restart.txt

          bye
          EOF
